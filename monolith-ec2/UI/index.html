<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudMart University</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>CloudMart University</h1>

    <div class="login">

        <h2>Login</h2>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

    </div>

    <hr>

    <h2>Students</h2>

    <button onclick="loadStudents()">Refresh Students</button>

    <table id="studentsTable">

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>

    <hr>

    <h2>Add Student</h2>

    <form id="studentForm" onsubmit="addStudent(event)">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">Add Student</button>
    </form>

    <hr>

    <h2>Add Course</h2>

    <form id="courseForm" onsubmit="addCourse(event)">
        <input type="text" id="courseCode" placeholder="Course Code" required>
        <input type="text" id="courseTitle" placeholder="Course Title" required>
        <button type="submit">Add Course</button>
    </form>

</div>

<script src="app.js"></script>

</body>
</html>
