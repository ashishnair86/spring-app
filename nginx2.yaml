apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx2
  namespace: frontend
  labels:
    app.kubernetes.io/name: nginx2
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx2
    spec:
      containers:
      - name: nginx2
        image: "ghcr.io/example/orders-api:1.0.0"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # readinessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8080
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8080
        #   initialDelaySeconds: 30
        #   periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nginx2
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx2
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx2
  namespace: frontend
spec:
  rules:
  - host: orders.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx2
            port:
              number: 80
