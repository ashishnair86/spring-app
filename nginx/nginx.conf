events {}

http {
  server {
    listen 80;

    location /auth/ {
      proxy_pass http://auth-service:8080/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /students/ {

      proxy_set_header Authorization $http_authorization;
      auth_basic off;
      proxy_pass http://student-service:8080/students;
      proxy_pass_request_headers on;
      proxy_redirect off;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }


   location /courses {
      auth_basic off;

      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_pass http://course-service:8080/courses;

      proxy_pass_request_headers on;
      proxy_redirect off;

}
  
  location /enrollments {
     auth_basic off;

     proxy_set_header Authorization $http_authorization;
     proxy_set_header Host $host;

     proxy_set_header X-Real-IP $remote_addr;
     proxy_pass http://enrollment-service:8080/enrollments;
     proxy_pass_request_headers on;
     proxy_redirect off;
}

  location /jenkins/ {

    proxy_pass http://jenkins:8080/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_redirect off;
}
  }
}
